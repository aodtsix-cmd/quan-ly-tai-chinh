<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tài chính</title>
<!-- GitHub Pages serves this repo from its root, but the app itself lives in
     /sheet-lite/. Without this file the URL shown in Settings → Pages is a
     bare 404, which reads as "the deployment is broken". Pages can't do a
     server-side redirect, so this is the standard meta+JS stand-in, with a
     real link as the fallback if both are blocked. -->
<link rel="canonical" href="sheet-lite/">
<meta http-equiv="refresh" content="0; url=sheet-lite/">
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f2; color: #1a1d23;
  }
  @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e6e8ec; } }
  .box { text-align: center; padding: 2rem; }
  a { color: #3f5175; font-weight: 600; }
  @media (prefers-color-scheme: dark) { a { color: #93a7cf; } }
</style>
</head>
<body>
  <div class="box">
    <p>Đang mở Sổ tài chính…</p>
    <p><a href="sheet-lite/">Bấm vào đây nếu trang không tự chuyển</a></p>
  </div>
  <script>location.replace("sheet-lite/");</script>
</body>
</html>
